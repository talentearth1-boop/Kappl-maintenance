.pill{font-size:12px;padding:2px 9px;border-radius:99px;color:#fff;white-space:nowrap}.ok{background:var(--ok)}.wa{background:var(--wa)}.er{background:var(--er)}
button,.btn{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#fff;display:inline-block}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}button.sm{padding:5px 10px;font-size:13px}
input,select,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}h2{font-size:16px;margin:14px 4px 8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:14px 2px;font-size:13px}nav button.on{color:var(--ac);font-weight:700}
.th{width:72px;height:72px;object-fit:cover;border-radius:8px;margin:6px 6px 0 0;border:1px solid var(--bd)}
.mt{border-collapse:collapse;font-size:11px}.mt td,.mt th{border:1px solid var(--bd);padding:3px;text-align:center;min-width:24px}.mt .nm{position:sticky;left:0;background:var(--card);text-align:left;min-width:150px;white-space:nowrap;z-index:1;color:var(--tx)}
@media print{nav,header,.noprint,#toast{display:none!important}body{padding:0;background:#fff;color:#000}.card{border:0}div[style*="overflow-x"]{overflow:visible!important}}
#toast{position:fixed;left:12px;right:12px;bottom:80px;background:var(--tx);color:var(--bg);padding:10px;border-radius:10px;text-align:center;display:none;z-index:50}

const today=()=>new Date().toLocaleDateString("en-CA");
let D={done:{},issues:[],log:[],checks:{}},tab="today",sel=null,form=false,pre=1,imgs=[],busy=false;
const DAY=864e5,key=(a,i)=>a+"_"+i,f=d=>new Date(d).toLocaleDateString(undefined,{day:"numeric",month:"short"});

async function load(){try{const [d,l,b,c,ho]=await Promise.all([api("/rest/v1/task_done?select=*"),api("/rest/v1/activity_log?select=*&order=at.desc&limit=60"),api("/rest/v1/breakdowns?select=*&order=started_at.desc&limit=100"),api("/rest/v1/daily_checks?select=*&check_date=eq."+today()),api("/rest/v1/boiler_handover?select=*&order=created_at.desc&limit=8")]);D.ho=ho;D.checks={};c.forEach(x=>D.checks[x.key]=x);

let uSel={},hsel=null,recDate=null,recData=null,recMode="day",recMonth=null,monData=null;

function needBy(k){const [id,u]=k.split("_");if(getBy(id,u))return false;msg("Enter the Checked by name first");const b=document.getElementById("by_"+id+"_"+u);if(b){b.focus();b.scrollIntoView({block:"center"})}return true}

async function mark(k,st){if(needBy(k))return;const el=document.getElementById("rm_"+k),rm=st=="no"?((el||{}).value||"").trim():"";if(st=="no"&&!rm){msg("Please write a remark describing the problem");return}

let bdFrom=null,bdTo=null,bdEq="",bdData=null;
const bdQ=()=>"/rest/v1/breakdowns?select=*&started_at=gte."+encodeURIComponent(new Date(bdFrom+"T00:00:00").toISOString())+"&started_at=lte."+encodeURIComponent(new Date(bdTo+"T23:59:59").toISOString())+(bdEq?"&equipment=eq."+encodeURIComponent(bdEq):"")+"&order=started_at.desc,id.desc";

const dmin=x=>x.restored_at?Math.max(0,Math.round((new Date(x.restored_at)-new Date(x.started_at))/6e4)):null;
function bdHTML(){let h=`<div class="card noprint"><label>From</label><input type="date" value="${bdFrom||today().slice(0,7)+"-01"}" max="${today()}" onchange="if(this.value){bdFrom=this.value;bdData=null;render();loadBd()}"><label>To</label><input type="date" value="${bdTo||today()}" max="${today()}" onchange="if(this.value){bdTo=this.value;bdData=null;render();loadBd()}"><label>Equipment</label><select onchange="bdEq=this.value;bdData=null;render();loadBd()"><option value="">All equipment</option>${A.map(a=>`<option ${a.n==bdEq?"selected":""}>${a.n}</option>`).join("")}</select><div class="row" style="gap:8px"><button class="sm" onclick="csvBd()">⬇ Breakdowns (CSV)</button><button class="sm g" onclick="window.print()">🖨 Print / PDF</button></div></div>`;

imgs=[];form=false;msg("Saved");await load()}catch(e){er(e)}busy=false}
async function closeI(id){const x=D.issues.find(y=>y.id==id),ac=(document.getElementById("ac"+id)||{}).value||"",n=new Date().toISOString();
try{await api("/rest/v1/breakdowns?id=eq."+id,{method:"PATCH",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({restored_at:n,action_taken:ac.trim()||x.action_taken})});await logit("Resolved: "+x.equipment+" — "+x.description);load()}catch(e){er(e)}}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
if(form&&tab=="issues"&&document.getElementById("fd")||hoOpen&&document.getElementById("hoo")||document.activeElement&&/^(by_|ae$|ap$)/.test(document.activeElement.id))return;const el=document.getElementById("app");let h="";
if(tab=="today"){h+=todayHTML()}else if(tab=="home"&&!sel){const c=[0,0,0];A.forEach(a=>c[astat(a)]++);const open=D.issues.filter(x=>!x.restored_at).length;
h+=`<div class="sum"><div><b style="color:var(--ok)">${c[0]}</b><span>Healthy</span></div><div><b style="color:var(--wa)">${c[1]}</b><span>Due soon</span></div><div><b style="color:var(--er)">${c[2]}</b><span>Overdue</span></div></div>`;
if(open)h+=`<div class="card tap" style="border-color:var(--er)" onclick="tab='issues';render()">⚠️ ${open} open breakdown${open>1?"s":""}</div>`;
A.forEach(a=>{const v=astat(a),n=a.t.filter((t,i)=>st(a.id,i,t[1]).v>0).length;
h+=`<div class="card tap row" onclick="sel=${a.id};render()"><div><div class="name">${a.i} ${a.n}</div><div class="mu">${a.q>1?a.q+" units · ":""}${n} task${n!=1?"s":""} pending · Daily ${dailyDone(a)}</div></div><span class="pill ${lab[v]}">${txt[v]}</span></div>`})}
else if(tab=="home"){const a=A.find(x=>x.id==sel);
h+=`<div class="row" style="margin:8px 0"><button class="g sm" onclick="sel=null;render()">← Back</button><button class="sm" onclick="openForm(${a.id})">Report issue</button></div><h2>${a.i} ${a.n}${a.q>1?" ("+a.q+" units)":""}</h2>`;
a.t.forEach((t,i)=>{const s=st(a.id,i,t[1]),d=D.done[key(a.id,i)];
h+=`<div class="card"><div class="row"><div><div class="name">${t[0]}</div><div class="mu">${fq(t[1])} · ${d?"Last: "+f(d):"Not recorded"}</div></div><span class="pill ${s.s}">${s.l}</span></div><button class="sm" style="margin-top:8px" onclick="done(${a.id},${i})">✓ Mark done</button></div>`})}
else if(tab=="rec"){h+=recHTML()}else if(tab=="issues"){
if(form){h+=`<div class="card"><label>Equipment</label><select id="fa">${A.map(a=>`<option value="${a.id}" ${a.id==pre?"selected":""}>${a.n}</option>`).join("")}</select>
<label>Unit no. (if multiple)</label><input id="fu" placeholder="e.g. Machine 4">
<label>Priority</label><select id="fp"><option>High</option><option selected>Medium</option><option>Low</option></select>
<label>Breakdown type</label><select id="fty"><option>Mechanical</option><option>Electrical</option><option>Instrumentation</option><option>Utility (steam / air / water)</option><option>Other</option></select>
<label>Problem</label><textarea id="fd" rows="3" placeholder="What happened?"></textarea>
<label>Root cause (if known)</label><input id="fc"><label>Action taken</label><input id="fac">
<label>Technician name</label><input id="ft" value="${esc(localStorage.getItem("tech")||"")}">
<label>Breakdown started</label><input id="fs" type="datetime-local" value="${loc(new Date())}">
<label>Machine restored (leave blank if still down)</label><input id="fe" type="datetime-local">
<label>Spares used (name & qty)</label><input id="fsp" placeholder="e.g. Bearing 6205 ×2, V-belt B52 ×1">
<label>Photos (up to 3) – tap a photo to remove it</label>
<div style="display:flex;gap:8px;margin:4px 0 6px"><label for="ph1" class="btn" style="flex:1;text-align:center;color:#fff;font-size:15px">📷 Take picture</label><label for="ph2" class="btn" style="flex:1;text-align:center;color:var(--ac);background:transparent;border:1px solid var(--ac);font-size:15px">🖼️ Gallery</label></div><input id="ph1" type="file" accept="image/*" capture="environment" onchange="pick(this)" style="position:absolute;opacity:0;width:1px;height:1px"><input id="ph2" type="file" accept="image/*" onchange="pick(this)" style="position:absolute;opacity:0;width:1px;height:1px">
<div id="pv" style="margin-bottom:10px">${imgs.map((s,i)=>`<img class="th" src="${s.u}" onclick="imgs.splice(${i},1);prev()">`).join("")}</div>
<div class="row"><button class="g" onclick="closeForm()">Cancel</button><button onclick="addIssue()">Save</button></div></div>`}
else h+=`<div style="margin:8px 0"><button onclick="openForm(1)">+ Report breakdown</button></div>`;
if(!D.issues.length&&!form)h+=`<div class="card mu">No breakdowns logged.</div>`;
D.issues.forEach(x=>{const cl=!!x.restored_at;
h+=`<div class="card"><div class="row"><div class="name">${esc(x.equipment)}${x.unit?" · "+esc(x.unit):""}</div><span class="pill ${cl?"ok":x.priority=="High"?"er":"wa"}">${cl?"Closed":esc(x.priority)}</span></div>
<div>${esc(x.description)}</div><div class="mu">${f(x.started_at)}${x.technician?" · by "+esc(x.technician):""}</div>
<div class="mu">⏱ Downtime: ${dt(x)}</div>${x.btype?`<div class="mu">Type: ${esc(x.btype)}</div>`:""}${x.root_cause?`<div class="mu">Cause: ${esc(x.root_cause)}</div>`:""}${x.action_taken?`<div class="mu">Action: ${esc(x.action_taken)}</div>`:""}${x.spares?`<div class="mu">🔩 Spares: ${esc(x.spares)}</div>`:""}
<div>${(x.photos||[]).map(s=>`<img class="th" src="${esc(s)}" onclick="big(this.src)">`).join("")}</div>
${cl?"":`<input id="ac${x.id}" placeholder="Action taken to fix (optional)" style="margin-top:8px"><button class="sm" onclick="closeI(${x.id})">Mark resolved</button>`}</div>`})}
else{h+=`<h2>Recent maintenance</h2>`;if(!D.log.length)h+=`<div class="card mu">Nothing recorded yet.</div>`;
D.log.forEach(x=>h+=`<div class="card"><div>${esc(x.message)}</div><div class="mu">${new Date(x.at).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</div></div>`)}
el.innerHTML=h}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;sel=null;hsel=null;hoOpen=false;form=false;imgs=[];if(tab=="rec"){recDate=today();recData=null;loadRec();recMonth=today().slice(0,7);monData=null;if(recMode=="mon")loadMon();shData=null;if(recMode=="sheet")loadSheet();bdData=null;if(recMode=="bd")loadBd();hoData=null;if(recMode=="ho")loadHoA()}render();scrollTo(0,0)});
window.onerror=m=>msg("Error: "+m);render();load();setInterval(load,20000);
</script></body></html>
